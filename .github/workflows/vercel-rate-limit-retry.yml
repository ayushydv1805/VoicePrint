name: Vercel rate-limit retry

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  retry-once-after-rate-limit:
    if: ${{ !contains(github.event.head_commit.message, '[vercel-retry]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Vercel rate-limit window
        run: sleep 4200

      - name: Check latest Vercel status
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          state="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main/status" |
            jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "unknown"')"
          echo "vercel_state=$state" >> "$GITHUB_OUTPUT"
          echo "Vercel status: $state"

      - name: Retry Vercel deployment once
        if: ${{ steps.status.outputs.vercel_state != 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Deploy: retry Vercel production after rate limit [vercel-retry]"
          git push origin HEAD:main
