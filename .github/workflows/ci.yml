name: VoicePrint CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install backend
        working-directory: server
        run: npm install

      - name: Backend tests
        working-directory: server
        run: npm test

      - name: Check backend syntax
        run: |
          node --check server/index.js
          node --check server/index-phase4.js